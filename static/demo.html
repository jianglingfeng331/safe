<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>没丢 - 演示版</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
/* ══════════════════════════════════════════
   Reset & Base — 暗色主题
   ══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#111827;color:#F3F4F6;
  min-height:100dvh;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
  max-width:480px;margin:0 auto;
}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 12px}
.header-left{display:flex;flex-direction:column}
.title{font-size:28px;font-weight:700;color:#818CF8;letter-spacing:2px}
.subtitle{display:block;font-size:13px;color:#6B7280;margin-top:4px}
.demo-badge{
  font-size:11px;font-weight:600;color:#FBBF24;
  background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.3);
  padding:4px 10px;border-radius:8px;flex-shrink:0;
}

/* Quick Tags */
.quick-tags{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;margin-bottom:16px}
.tag{padding:6px 12px;border-radius:20px;border:1px solid #374151;background:#1F2937;font-size:13px;color:#D1D5DB;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;min-width:0;flex-shrink:1}
.tag:active{background:#374151}
.tag.active{color:#fff}
.tag-record{border-color:#818CF8;color:#818CF8}
.tag-record.active{background:#6366F1;border-color:#6366F1;color:#fff}
.tag-find{border-color:#34D399;color:#34D399}
.tag-find.active{background:#059669;border-color:#059669;color:#fff}
.tag-drawer{border-color:#FBBF24;color:#FBBF24}
.tag-drawer.active{background:#D97706;border-color:#D97706;color:#fff}
.tag-expiry{border-color:#F87171;color:#F87171}
.tag-expiry.active{background:#DC2626;border-color:#DC2626;color:#fff}
.tag-expired{border-color:#F97316;color:#F97316}
.tag-expired.active{background:#EA580C;border-color:#EA580C;color:#fff}

/* Search Bar */
.manual-input{padding:0 4px;margin-bottom:12px}
.search-bar{
  position:relative;display:flex;align-items:center;
  background:rgba(31,41,55,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(55,65,81,.6);border-radius:16px;
  padding:4px 4px 4px 6px;
  box-shadow:0 4px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.04);
  transition:all .3s cubic-bezier(.4,0,.2,1)
}
.search-bar:focus-within{
  border-color:rgba(99,102,241,.5);
  box-shadow:0 6px 32px rgba(99,102,241,.12),0 0 0 3px rgba(99,102,241,.1),inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(-1px)
}
.text-input{
  flex:1;min-width:0;padding:12px 14px;border:none;border-radius:12px;font-size:15px;
  outline:none;background:transparent;color:#F3F4F6
}
.text-input::placeholder{color:#4B5563;transition:color .3s}
.search-bar:focus-within .text-input::placeholder{color:#6B7280}
.btn-submit{
  flex-shrink:0;padding:11px 22px;border:none;border-radius:13px;
  font-size:14px;font-weight:600;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#6366F1,#4F46E5 50%,#7C3AED);
  background-size:150% 150%;background-position:0 0;
  box-shadow:0 2px 8px rgba(99,102,241,.25),0 1px 2px rgba(99,102,241,.1);
  transition:all .3s cubic-bezier(.4,0,.2,1);letter-spacing:.5px;
  -webkit-tap-highlight-color:transparent
}
.btn-submit:not(:disabled):hover{background-position:100% 100%;box-shadow:0 4px 16px rgba(99,102,241,.35),0 2px 4px rgba(99,102,241,.18);transform:translateY(-1px)}
.btn-submit:not(:disabled):active{transform:translateY(0) scale(.97);box-shadow:0 1px 4px rgba(79,70,229,.25);transition:all .1s}
.btn-submit:disabled{background:linear-gradient(135deg,#374151,#4B5563);box-shadow:none;cursor:default;color:rgba(255,255,255,.4)}

/* Record Form */
.record-form{background:#1F2937;border-radius:14px;padding:16px;margin-bottom:12px;animation:fadeIn .25s ease}
.record-mode-tabs{display:flex;gap:0;margin-bottom:14px;border-radius:10px;overflow:hidden;border:1.5px solid #374151}
.record-mode-tab{flex:1;padding:9px 0;border:none;background:#111827;font-size:14px;font-weight:500;color:#9CA3AF;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.record-mode-tab.active{background:#6366F1;color:#fff;font-weight:600}
.record-mode-tab:not(.active):active{background:#1F2937}
.record-single{display:flex;flex-direction:column;gap:10px}
.record-fields{display:flex;flex-direction:column;gap:8px}
.record-input{width:100%;padding:11px 14px;border:1.5px solid #374151;border-radius:10px;font-size:15px;outline:none;background:#111827;color:#F3F4F6;transition:border-color .15s}
.record-input:focus{border-color:#6366F1}
.record-input::placeholder{color:#4B5563}
.btn-add-item{padding:11px 0;border:2px dashed rgba(99,102,241,.25);border-radius:10px;background:rgba(99,102,241,.1);color:#818CF8;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn-add-item:active{background:rgba(99,102,241,.18);border-color:#6366F1}
.record-batch{display:flex;flex-direction:column;gap:10px}
.batch-textarea{width:100%;min-height:140px;padding:12px 14px;border:1.5px solid #374151;border-radius:10px;font-size:14px;font-family:"SF Mono",Menlo,Consolas,monospace;outline:none;background:#111827;color:#F3F4F6;resize:vertical;line-height:1.6;transition:border-color .15s}
.batch-textarea:focus{border-color:#6366F1}
.batch-textarea::placeholder{color:#4B5563;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.btn-parse{padding:11px 0;border:none;border-radius:10px;background:#6366F1;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-parse:active{background:#4F46E5}
.pending-list{margin-top:16px;padding-top:16px;border-top:1px solid #374151}
.pending-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pending-header h3{font-size:15px;font-weight:600;color:#D1D5DB}
.pending-count{font-size:13px;font-weight:400;color:#6B7280;margin-left:4px}
.pending-items{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;max-height:240px;overflow-y:auto}
.pending-item{display:flex;align-items:center;gap:6px;padding:9px 10px;background:#111827;border-radius:8px;font-size:13px}
.pending-drawer{font-weight:600;color:#A5B4FC;background:rgba(99,102,241,.15);padding:2px 8px;border-radius:4px;font-size:12px;flex-shrink:0;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pending-arrow{color:#4B5563;font-size:12px;flex-shrink:0}
.pending-name{flex:1;font-weight:500;color:#F3F4F6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pending-date{font-size:11px;color:#FCA5A5;font-weight:500;flex-shrink:0}
.pending-purpose{font-size:11px;color:#C4B5FD;font-weight:500;flex-shrink:0;background:rgba(124,58,237,.15);padding:2px 6px;border-radius:4px}
.btn-submit-all{width:100%;padding:12px 0;border:none;border-radius:12px;background:#059669;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-submit-all:active{background:#047857}

/* Result Area */
.result-area{background:#1F2937;border-radius:14px;padding:16px;margin-bottom:16px;animation:fadeIn .25s ease}
.result-msg{font-size:15px;font-weight:600;color:#F3F4F6;margin-bottom:10px}
.result-loading{text-align:center;color:#6B7280;font-size:14px;padding:12px 0}
.result-items{display:flex;flex-direction:column;gap:4px}
.result-item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #374151;font-size:14px}
.result-item:last-child{border-bottom:none}
.result-item-name{font-weight:600;flex:1;color:#F3F4F6}
.result-item-drawer{font-size:11px;color:#D1D5DB;background:#374151;padding:2px 8px;border-radius:4px;flex-shrink:0}
.result-item-expiry{font-size:11px;color:#F87171;font-weight:500}
.result-item-purpose{font-size:11px;color:#C4B5FD;font-weight:500;background:rgba(124,58,237,.15);padding:2px 8px;border-radius:4px}
.result-item-ok{font-size:11px;color:#34D399;background:rgba(5,150,105,.15);padding:2px 8px;border-radius:4px;font-weight:500}

/* Boxes Grid */
.boxes-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;margin-top:8px}
.boxes-header h3{font-size:16px;font-weight:600;color:#D1D5DB}
.btn-add-box{display:flex;align-items:center;gap:4px;padding:7px 14px;border-radius:10px;border:1px solid #FBBF24;background:#1F2937;color:#FBBF24;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-add-box:active{background:#374151}
.boxes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.box-card{position:relative;background:#1F2937;border-radius:14px;padding:20px 12px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.box-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.box-card:active{transform:scale(.95)}
.box-icon{margin-bottom:8px}
.box-icon svg{filter:drop-shadow(0 2px 4px rgba(99,102,241,.3))}
.box-name{font-size:14px;font-weight:600;color:#F3F4F6;word-break:break-all;line-height:1.3}
.box-count{font-size:11px;color:#6B7280;margin-top:4px}

/* Drawer Items View */
.drawer-items-view{margin-bottom:16px}
.drawer-items-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.btn-back{width:36px;height:36px;border-radius:50%;border:none;background:#374151;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#D1D5DB;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-back:active{background:#4B5563}
.drawer-items-title{font-size:18px;font-weight:700;color:#F3F4F6}
.drawer-items-list{display:flex;flex-direction:column;gap:8px}

/* Item Card */
.item-card{display:flex;align-items:center;gap:10px;background:#1F2937;border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;overflow:hidden;animation:cardIn .35s ease both}
.item-card::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:60%;border-radius:0 3px 3px 0}
.accent-0::before{background:#6366F1}.accent-1::before{background:#EC4899}.accent-2::before{background:#10B981}.accent-3::before{background:#F59E0B}.accent-4::before{background:#8B5CF6}.accent-5::before{background:#06B6D4}.accent-6::before{background:#F97316}.accent-7::before{background:#EF4444}
.item-body{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.item-name{font-size:16px;font-weight:600;color:#F3F4F6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-drawer-tag{font-size:11px;font-weight:500;color:#D1D5DB;background:#374151;padding:3px 8px;border-radius:6px;letter-spacing:.2px;flex-shrink:0}
.exp-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;flex-shrink:0;line-height:1.4}
.exp-badge.ok{color:#34D399;background:rgba(5,150,105,.15)}
.exp-badge.notice{color:#FBBF24;background:rgba(217,119,6,.15)}
.exp-badge.warning{color:#F97316;background:rgba(234,88,12,.15)}
.exp-badge.expired{color:#F87171;background:rgba(220,38,38,.15)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Log Section */
.log-section{margin-top:20px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 2px}
.section-header h2{font-size:17px;font-weight:700;color:#F3F4F6;letter-spacing:.3px}
.log-count{font-size:13px;font-weight:400;color:#6B7280;margin-left:6px}
.btn-text{background:none;border:none;color:#818CF8;font-size:13px;font-weight:500;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-text:active{background:rgba(99,102,241,.08)}
.log-list{display:flex;flex-direction:column;gap:6px}
.log-item{background:#1F2937;border-radius:10px;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center;gap:8px}
.log-summary{font-size:13px;color:#D1D5DB;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.log-intent{font-size:11px;font-weight:600;color:#A78BFA;background:rgba(139,92,246,.15);padding:2px 6px;border-radius:4px}
.log-time{font-size:11px;color:#6B7280;white-space:nowrap}
.empty{text-align:center;color:#4B5563;font-size:14px;padding:36px 0 24px;line-height:1.6}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#374151;color:#F3F4F6;padding:12px 24px;border-radius:10px;font-size:14px;z-index:999;animation:fadeIn .2s ease;pointer-events:none;white-space:nowrap}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
  Header — 演示模式，无登录
  ══════════════════════════════════════════ -->
<header class="header">
  <div class="header-left">
    <h1 class="title">没丢</h1>
    <span class="subtitle">看，东西都在这</span>
  </div>
  <span class="demo-badge">演示模式</span>
</header>

<!-- Quick Tags -->
<div class="quick-tags">
  <button class="tag tag-record" onclick="switchMode('record')">登记</button>
  <button class="tag tag-find" onclick="switchMode('find')">查找</button>
  <button class="tag tag-drawer active" onclick="switchMode('drawer')">箱子</button>
  <button class="tag tag-expiry" onclick="switchMode('expiry')">临期</button>
  <button class="tag tag-expired" onclick="switchMode('expired')">到期</button>
</div>

<!-- Search Bar（查找模式） -->
<div id="manualInput" class="manual-input hidden">
  <div class="search-bar">
    <input type="text" id="textInput" class="text-input" placeholder="如：头孢在哪" autocomplete="off" enterkeyhint="send">
    <button id="submitBtn" class="btn-submit" disabled>查询</button>
  </div>
</div>

<!-- ══════════════════════════════════════════
  Record Form（登记模式）
  ══════════════════════════════════════════ -->
<div id="recordForm" class="record-form hidden">
  <div class="record-mode-tabs">
    <button class="record-mode-tab active" onclick="switchRecordMode('single')" id="tabSingle">单条录入</button>
    <button class="record-mode-tab" onclick="switchRecordMode('batch')" id="tabBatch">批量录入</button>
  </div>
  <div id="recordSingle" class="record-single">
    <div class="record-fields">
      <input type="text" id="recordDrawer" class="record-input" placeholder="箱子（如：药箱）" autocomplete="off" list="drawerList">
      <datalist id="drawerList">
        <option value="药箱"><option value="冰箱"><option value="工具箱">
      </datalist>
      <input type="text" id="recordItem" class="record-input" placeholder="物品（如：头孢）">
      <input type="text" id="recordPurpose" class="record-input" placeholder="用途（可选，如：退烧）">
      <input type="text" id="recordDate" class="record-input" placeholder="到期时间（可选，如 20260630）">
    </div>
    <button class="btn-add-item" onclick="addRecordItem()">添加到列表</button>
  </div>
  <div id="recordBatch" class="record-batch hidden">
    <textarea id="batchInput" class="batch-textarea" placeholder="每行一条，格式：箱子,物品,用途,到期时间&#10;用途和到期时间可选，示例：&#10;药箱,头孢,退烧,20260630&#10;药箱,创可贴&#10;冰箱,酸奶,,2026-06-20"></textarea>
    <button class="btn-parse" onclick="parseBatch()">解析预览</button>
  </div>
  <div id="pendingList" class="pending-list hidden">
    <div class="pending-header">
      <h3>待登记 <span id="pendingCount" class="pending-count"></span></h3>
      <button class="btn-text" onclick="clearPending()">清空</button>
    </div>
    <div id="pendingItems" class="pending-items"></div>
    <button class="btn-submit-all" onclick="submitAllRecords()">提交全部</button>
  </div>
</div>

<!-- Result Area -->
<div id="result" class="result-area hidden"></div>

<!-- Boxes Grid -->
<div class="boxes-header" id="boxesHeader">
  <h3>我的箱子</h3>
  <button class="btn-add-box" onclick="addBox()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新增箱子
  </button>
</div>
<div id="boxesGrid" class="boxes-grid"></div>

<!-- Drawer Items View -->
<div id="drawerItemsView" class="drawer-items-view hidden">
  <div class="drawer-items-header">
    <button class="btn-back" onclick="backToBoxes()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 id="drawerItemsTitle" class="drawer-items-title"></h2>
  </div>
  <div id="drawerItemsList" class="drawer-items-list"></div>
</div>

<!-- Log Section -->
<section class="log-section">
  <div class="section-header">
    <h2>日志<span id="logCount" class="log-count"></span></h2>
  </div>
  <div id="logList" class="log-list"></div>
</section>

<script>

//  模拟数据
// ══════════════════════════════════════════════

const MOCK_LOGS = [

  { summary:'查找"冰箱里有什么"→ 冰箱，4 条结果', intent:'查询', time:'06-19 09:00' },

  { summary:'登记了「创可贴」（外伤止血）→ 药箱', intent:'登记', time:'06-18 11:18' },
  { summary:'登记了「电钻」（钻孔）→ 工具箱', intent:'登记', time:'06-17 15:05' },
  { summary:'登记了「酸奶」（早餐，至 2026-06-25）→ 冰箱', intent:'登记', time:'06-17 08:30' },
];

// ══════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════
let currentMode = 'drawer';
let pendingRecords = [];

// ══════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════
(function init() {
  loadBoxes();
  loadLogSection();

  const textInput = document.getElementById('textInput');
  const submitBtn = document.getElementById('submitBtn');
  textInput.addEventListener('input', () => { submitBtn.disabled = !textInput.value.trim(); });
  textInput.addEventListener('keydown', (e) => { if (e.key==='Enter') { e.preventDefault(); doSearch(textInput.value); }});
  submitBtn.addEventListener('click', () => { doSearch(textInput.value); });
})();

// ══════════════════════════════════════════════
//  Mode Switching
// ══════════════════════════════════════════════
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('boxesGrid').classList.add('hidden');
  document.getElementById('boxesHeader').classList.add('hidden');
  document.getElementById('drawerItemsView').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('recordForm').classList.add('hidden');
  document.getElementById('manualInput').classList.add('hidden');

  document.querySelectorAll('.quick-tags .tag').forEach(t => t.classList.remove('active'));

  if (mode === 'record') {
    document.querySelector('.tag-record').classList.add('active');
    document.getElementById('recordForm').classList.remove('hidden');
    switchRecordMode('single');
    if (pendingRecords.length > 0) renderPendingList();
  } else if (mode === 'find') {
    document.querySelector('.tag-find').classList.add('active');
    document.getElementById('manualInput').classList.remove('hidden');
    document.getElementById('textInput').focus();
  } else if (mode === 'drawer') {
    document.querySelector('.tag-drawer').classList.add('active');
    document.getElementById('boxesHeader').classList.remove('hidden');
    document.getElementById('boxesGrid').classList.remove('hidden');
    loadBoxes();
  } else if (mode === 'expiry') {
    document.querySelector('.tag-expiry').classList.add('active');
    loadExpiring();
  } else if (mode === 'expired') {
    document.querySelector('.tag-expired').classList.add('active');
    loadExpired();
  }
}

function switchRecordMode(mode) {
  const tabSingle = document.getElementById('tabSingle');
  const tabBatch = document.getElementById('tabBatch');
  if (mode === 'single') {
    tabSingle.classList.add('active'); tabBatch.classList.remove('active');
    document.getElementById('recordSingle').classList.remove('hidden');
    document.getElementById('recordBatch').classList.add('hidden');
  } else {
    tabBatch.classList.add('active'); tabSingle.classList.remove('active');
    document.getElementById('recordBatch').classList.remove('hidden');
    document.getElementById('recordSingle').classList.add('hidden');
  }
}

// ══════════════════════════════════════════════
//  Search
// ══════════════════════════════════════════════
function doSearch(text) {
  if (!text || !text.trim()) return;
  text = text.trim();
  document.getElementById('textInput').value = '';
  document.getElementById('submitBtn').disabled = true;

  const result = document.getElementById('result');
  result.classList.remove('hidden');

  // 从所有抽屉中匹配
  const allItems = [];
  for (const [drawer, items] of Object.entries(MOCK_DATA)) {
    items.forEach(it => { allItems.push({ ...it, drawer }); });
  }

  const q = text.toLowerCase();
  const matches = allItems.filter(it =>
    it.item.toLowerCase().includes(q) ||
    (it.purpose && it.purpose.toLowerCase().includes(q)) ||
    it.drawer.toLowerCase().includes(q)
  );

  let html = '';
  if (matches.length === 0) {
    html = '<div class="result-msg">未找到匹配的物品</div>';
  } else {
    html += `<div class="result-msg">找到 ${matches.length} 件物品</div>`;
    html += '<div class="result-items">';
    matches.forEach(r => {
      const purp = r.purpose ? ` <span class="result-item-purpose">${esc(r.purpose)}</span>` : '';
      const exp = r.expiry ? ` <span class="result-item-expiry">至${esc(r.expiry)}</span>` : '';
      html += `<div class="result-item">
        <span class="result-item-name">${esc(r.item)}</span>
        <span class="result-item-drawer">${esc(r.drawer)}</span>${purp}${exp}
      </div>`;
    });
    html += '</div>';
  }
  result.innerHTML = html;

  // 追加查询日志
  addLog(`查找"${esc(text)}"→ ${matches.length} 条结果`, '查询');
}

// ══════════════════════════════════════════════
//  Record Form
// ══════════════════════════════════════════════
function addRecordItem() {
  const drawer = document.getElementById('recordDrawer').value.trim();
  const item = document.getElementById('recordItem').value.trim();
  const purpose = document.getElementById('recordPurpose').value.trim();
  const dateRaw = document.getElementById('recordDate').value.trim();

  if (!drawer) { showToast('请输入箱子名'); return; }
  if (!item) { showToast('请输入物品名'); return; }

  const date = parseDate(dateRaw);
  pendingRecords.push({ drawer, item, purpose, date });

  document.getElementById('recordItem').value = '';
  document.getElementById('recordPurpose').value = '';
  document.getElementById('recordDate').value = '';
  document.getElementById('recordItem').focus();

  // Also add to mock data if drawer exists
  if (MOCK_DATA[drawer]) {
    const newId = Math.max(0, ...Object.values(MOCK_DATA).flat().map(i=>i.id)) + 1;
    MOCK_DATA[drawer].push({ id: newId, item, purpose, expiry: date });
  } else {
    // New drawer
    MOCK_DATA[drawer] = [{ id: Date.now(), item, purpose, expiry: date }];
    const dl = document.getElementById('drawerList');
    const opt = document.createElement('option');
    opt.value = drawer;
    dl.appendChild(opt);
  }

  renderPendingList();
}

function parseBatch() {
  const raw = document.getElementById('batchInput').value.trim();
  if (!raw) { showToast('请输入批量内容'); return; }

  const lines = raw.split('\n').filter(l => l.trim());
  const parsed = [];
  lines.forEach((line, idx) => {
    const parts = line.split(/[,，\t]+/).map(s => s.trim());
    if (parts.length < 2) return;
    const drawer = parts[0], item = parts[1];
    const purpose = parts[2] || '';
    const dateRaw = parts[3] || '';
    const date = parseDate(dateRaw);
    parsed.push({ drawer, item, purpose, date });
  });

  if (parsed.length === 0) { showToast('未解析到有效记录'); return; }

  parsed.forEach(r => {
    if (MOCK_DATA[r.drawer]) {
      MOCK_DATA[r.drawer].push({ id: Date.now()+Math.random(), item: r.item, purpose: r.purpose, expiry: r.date });
    } else {
      MOCK_DATA[r.drawer] = [{ id: Date.now(), item: r.item, purpose: r.purpose, expiry: r.date }];
    }
  });

  pendingRecords = pendingRecords.concat(parsed);
  document.getElementById('batchInput').value = '';
  renderPendingList();
}

function renderPendingList() {
  const listDiv = document.getElementById('pendingList');
  const itemsDiv = document.getElementById('pendingItems');
  const countSpan = document.getElementById('pendingCount');
  if (pendingRecords.length === 0) { listDiv.classList.add('hidden'); return; }
  listDiv.classList.remove('hidden');
  countSpan.textContent = `（${pendingRecords.length} 条）`;
  itemsDiv.innerHTML = pendingRecords.map((r,i) => {
    const purp = r.purpose ? ` <span class="pending-purpose">${esc(r.purpose)}</span>` : '';
    const date = r.date ? ` <span class="pending-date">到期 ${esc(r.date)}</span>` : '';
    return `<div class="pending-item">
      <span class="pending-drawer">${esc(r.drawer)}</span><span class="pending-arrow">→</span>
      <span class="pending-name">${esc(r.item)}</span>${purp}${date}
      <button onclick="removePendingItem(${i})" style="width:24px;height:24px;border:none;background:transparent;color:#6B7280;cursor:pointer;font-size:16px;line-height:1">&times;</button>
    </div>`;
  }).join('');
}

function removePendingItem(i) { pendingRecords.splice(i,1); renderPendingList(); }
function clearPending() { pendingRecords = []; renderPendingList(); }

function submitAllRecords() {
  if (pendingRecords.length === 0) return;
  const count = pendingRecords.length;
  pendingRecords.forEach(r => {
    addLog(`登记了「${r.item}」${r.purpose ? `（${r.purpose}）` : ''}${r.date ? `，至 ${r.date}` : ''}→ ${r.drawer}`, '登记');
  });
  const result = document.getElementById('result');
  result.classList.remove('hidden');
  result.innerHTML = `<div class="result-msg">全部登记成功</div>
    <div class="result-items"><div class="result-item"><span class="result-item-name">共 ${count} 条记录</span><span class="result-item-ok">已登记</span></div></div>`;
  pendingRecords = [];
  renderPendingList();
  loadLogSection();
}

// ══════════════════════════════════════════════
//  Boxes Grid
// ══════════════════════════════════════════════
function loadBoxes() {
  const drawers = Object.keys(MOCK_DATA);
  const grid = document.getElementById('boxesGrid');
  if (drawers.length === 0) { grid.innerHTML = '<div class="empty">还没有箱子</div>'; return; }
  grid.innerHTML = drawers.map((d,i) => {
    const count = MOCK_DATA[d].length;
    const colors = ['#6366F1','#EC4899','#10B981','#F59E0B','#8B5CF6','#06B6D4'];
    const c = colors[i % colors.length];
    return `<div class="box-card" onclick="viewBox('${escAttr(d)}')">
      <div class="box-icon"><svg viewBox="0 0 64 64" width="48" height="48">
        <polygon points="32,8 58,22 32,36 6,22" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="32,8 58,22 58,44 32,58 6,44 6,22" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
        <polyline points="32,36 32,58" stroke="${c}" stroke-width="2"/>
        <line x1="6" y1="22" x2="32" y2="36" stroke="${c}" stroke-width="1.5" opacity="0.4"/>
      </svg></div>
      <div class="box-name">${esc(d)}</div>
      <div class="box-count">${count} 件物品</div>
    </div>`;
  }).join('');
}

function viewBox(drawerName) {
  const items = MOCK_DATA[drawerName] || [];
  document.getElementById('boxesGrid').classList.add('hidden');
  document.getElementById('drawerItemsView').classList.remove('hidden');
  document.getElementById('drawerItemsTitle').textContent = `「${drawerName}」`;

  const list = document.getElementById('drawerItemsList');
  if (items.length === 0) { list.innerHTML = '<div class="empty">这个箱子是空的</div>'; return; }

  const accentIdx = Object.keys(MOCK_DATA).indexOf(drawerName) % 8;
  list.innerHTML = items.map(r => {
    let expBadge = '';
    if (r.expiry) {
      const d = new Date(r.expiry); const now = new Date();
      const dl = Math.ceil((d - now)/86400000);
      if (dl <= 0) expBadge = '<span class="exp-badge expired">已过期</span>';
      else if (dl <= 30) expBadge = `<span class="exp-badge warning">${dl}天到期</span>`;
      else expBadge = `<span class="exp-badge ok">${r.expiry}</span>`;
    }
    const purp = r.purpose ? `<span class="exp-badge ok">${esc(r.purpose)}</span>` : '';
    return `<div class="item-card accent-${accentIdx}">
      <div class="item-body"><span class="item-name">${esc(r.item)}</span>${purp}${expBadge}</div>
    </div>`;
  }).join('');
}

function backToBoxes() {
  document.getElementById('boxesHeader').classList.remove('hidden');
  document.getElementById('boxesGrid').classList.remove('hidden');
  document.getElementById('drawerItemsView').classList.add('hidden');
}

function addBox() {
  const name = prompt('请输入新箱子名称：');
  if (!name || !name.trim()) return;
  if (MOCK_DATA[name.trim()]) { showToast('箱子已存在'); return; }
  MOCK_DATA[name.trim()] = [];
  loadBoxes();
  showToast(`已新增「${name.trim()}」`);
}

// ══════════════════════════════════════════════
//  Expiry
// ══════════════════════════════════════════════
function loadExpiring() {
  const result = document.getElementById('result');
  result.classList.remove('hidden');

  const now = new Date();
  const threshold = new Date(now.getTime() + 90*86400000);
  const allItems = [];
  for (const [drawer, items] of Object.entries(MOCK_DATA)) {
    items.forEach(it => { allItems.push({ ...it, drawer }); });
  }

  const expiring = allItems.filter(it => {
    if (!it.expiry) return false;
    const d = new Date(it.expiry);
    return d >= now && d <= threshold;
  });

  if (expiring.length === 0) {
    result.innerHTML = '<div class="result-msg">没有临期物品</div>';
    return;
  }

  let html = `<div class="result-msg">${expiring.length} 件物品将在 90 天内到期</div><div class="result-items">`;
  expiring.forEach(r => {
    const d = new Date(r.expiry); const dl = Math.ceil((d - now)/86400000);
    const purp = r.purpose ? ` <span class="result-item-purpose">${esc(r.purpose)}</span>` : '';
    html += `<div class="result-item">
      <span class="result-item-name">${esc(r.item)}</span>
      <span class="result-item-drawer">${esc(r.drawer)}</span>${purp}
      <span class="result-item-expiry">${dl}天后到期</span>
    </div>`;
  });
  html += '</div>';
  result.innerHTML = html;
}

function loadExpired() {
  const result = document.getElementById('result');
  result.classList.remove('hidden');

  const now = new Date();
  now.setHours(0,0,0,0);
  const allItems = [];
  for (const [drawer, items] of Object.entries(MOCK_DATA)) {
    items.forEach(it => { allItems.push({ ...it, drawer }); });
  }

  const expired = allItems.filter(it => {
    if (!it.expiry) return false;
    const d = new Date(it.expiry);
    return d < now;
  });

  if (expired.length === 0) {
    result.innerHTML = '<div class="result-msg">没有已到期物品</div>';
    return;
  }

  let html = `<div class="result-msg">${expired.length} 件物品已到期</div><div class="result-items">`;
  expired.forEach(r => {
    const purp = r.purpose ? ` <span class="result-item-purpose">${esc(r.purpose)}</span>` : '';
    html += `<div class="result-item">
      <span class="result-item-name">${esc(r.item)}</span>
      <span class="result-item-drawer">${esc(r.drawer)}</span>${purp}
      <span class="result-item-expiry">${r.expiry} 已到期</span>
    </div>`;
  });
  html += '</div>';
  result.innerHTML = html;
}

// ══════════════════════════════════════════════
//  Log
// ══════════════════════════════════════════════
const demoLogs = [...MOCK_LOGS];

function loadLogSection() {
  const list = document.getElementById('logList');
  const countEl = document.getElementById('logCount');
  countEl.textContent = demoLogs.length > 0 ? `（共 ${demoLogs.length} 条）` : '';
  if (demoLogs.length === 0) { list.innerHTML = '<div class="empty">还没有记录</div>'; return; }
  list.innerHTML = demoLogs.map(l => `
    <div class="log-item">
      <div class="log-summary">${esc(l.summary)}</div>
      <div class="log-meta">
        <span class="log-intent">${esc(l.intent)}</span>
        <span class="log-time">${esc(l.time)}</span>
      </div>
    </div>
  `).join('');
}

function addLog(summary, intent) {
  const now = new Date();
  const time = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  demoLogs.unshift({ summary, intent, time });
  loadLogSection();
}

// ══════════════════════════════════════════════
//  Helpers
// ══════════════════════════════════════════════
function parseDate(str) {
  if (!str || !str.trim()) return '';
  str = str.trim();
  if (/^\d{8}$/.test(str)) {
    const y=str.slice(0,4), m=str.slice(4,6), d=str.slice(6,8);
    const mi=parseInt(m,10), di=parseInt(d,10);
    if (mi<1||mi>12||di<1||di>31) return '';
    return `${y}-${m}-${d}`;
  }
  const m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if (m) {
    const y=m[1], mo=m[2].padStart(2,'0'), d=m[3].padStart(2,'0');
    const mi=parseInt(mo,10), di=parseInt(d,10);
    if (mi<1||mi>12||di<1||di>31) return '';
    return `${y}-${mo}-${d}`;
  }
  return str;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function escAttr(s) { return String(s).replace(/'/g, "\\'"); }

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}
</script>
