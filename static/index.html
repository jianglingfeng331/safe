<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="没丢">
  <meta name="theme-color" content="#4F46E5">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>没丢</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ══════════════════════════════════════════════ -->
<!--  登录 / 注册页                              -->
<!-- ══════════════════════════════════════════════ -->
<div id="authPage" class="auth-page">
  <div class="auth-card">
    <h1 class="auth-logo">没丢</h1>
    <p class="auth-subtitle">家庭物品登记查询</p>

    <!-- 登录表单 -->
    <form id="loginForm" class="auth-form">
      <h2>登录</h2>
      <input type="text" id="loginUsername" placeholder="用户名" autocomplete="username" required minlength="2" maxlength="20">
      <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" required minlength="4">
      <div id="loginError" class="auth-error hidden"></div>
      <button type="submit" class="btn-auth">登录</button>
      <p class="auth-toggle">没有账号？<a href="#" onclick="showRegister()">立即注册</a></p>
    </form>

    <!-- 注册表单 -->
    <form id="registerForm" class="auth-form hidden">
      <h2>注册</h2>
      <input type="text" id="regUsername" placeholder="用户名（2-20位）" autocomplete="username" required minlength="2" maxlength="20">
      <input type="password" id="regPassword" placeholder="密码（至少4位）" autocomplete="new-password" required minlength="4">
      <div id="regError" class="auth-error hidden"></div>
      <button type="submit" class="btn-auth">注册</button>
      <p class="auth-toggle">已有账号？<a href="#" onclick="showLogin()">去登录</a></p>
    </form>
  </div>
</div>

<!-- ══════════════════════════════════════════════ -->
<!--  主应用（登录后可见）                       -->
<!-- ══════════════════════════════════════════════ -->
<div id="app" class="hidden">

  <!-- 顶部栏 -->
  <header class="header">
    <div>
      <h1 class="title">没丢</h1>
      <span class="subtitle">看，东西都在这</span>
    </div>
    <button id="logoutBtn" class="btn-logout" title="退出登录">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <!-- 快捷标签 -->
  <div class="quick-tags">
    <button class="tag tag-record" onclick="switchMode('record')">登记</button>
    <button class="tag tag-find" onclick="switchMode('find')">查找</button>
    <button class="tag tag-drawer" onclick="switchMode('drawer')">看箱子</button>
    <button class="tag tag-expiry" onclick="switchMode('expiry')">临期</button>
  </div>

  <!-- 自然语言输入区域（查找模式） -->
  <div id="manualInput" class="manual-input">
    <div class="search-bar">
      <input type="text" id="textInput" class="text-input" placeholder="如：头孢在哪" autocomplete="off" enterkeyhint="send">
      <button id="submitBtn" class="btn-submit" disabled>查询</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════ -->
  <!--  登记表单（登记模式）                       -->
  <!-- ══════════════════════════════════════════════ -->
  <div id="recordForm" class="record-form hidden">
    <!-- 单条/批量切换 -->
    <div class="record-mode-tabs">
      <button class="record-mode-tab active" onclick="switchRecordMode('single')" id="tabSingle">单条录入</button>
      <button class="record-mode-tab" onclick="switchRecordMode('batch')" id="tabBatch">批量录入</button>
    </div>

    <!-- 单条录入 -->
    <div id="recordSingle" class="record-single">
      <div class="record-fields">
        <input type="text" id="recordDrawer" class="record-input" placeholder="箱子（如：药箱）" list="drawerList" autocomplete="off">
        <datalist id="drawerList"></datalist>
        <input type="text" id="recordItem" class="record-input" placeholder="物品（如：头孢）">
        <input type="text" id="recordDate" class="record-input" placeholder="到期时间（可选，如 20260630）">
      </div>
      <button class="btn-add-item" onclick="addRecordItem()">添加到列表</button>
    </div>

    <!-- 批量录入 -->
    <div id="recordBatch" class="record-batch hidden">
      <textarea id="batchInput" class="batch-textarea" placeholder="每行一条，格式：箱子,物品,到期时间&#10;到期时间可选，示例：&#10;药箱,头孢,20260630&#10;药箱,创可贴&#10;冰箱,酸奶,2026-06-20"></textarea>
      <button class="btn-parse" onclick="parseBatch()">解析预览</button>
    </div>

    <!-- 待提交列表 -->
    <div id="pendingList" class="pending-list hidden">
      <div class="pending-header">
        <h3>待登记 <span id="pendingCount" class="pending-count"></span></h3>
        <button class="btn-text" onclick="clearPending()">清空</button>
      </div>
      <div id="pendingItems" class="pending-items"></div>
      <button class="btn-submit-all" onclick="submitAllRecords()">提交全部</button>
    </div>
  </div>

  <!-- 结果显示区域 -->
  <div id="result" class="result-area hidden"></div>

  <!-- 箱子网格 -->
  <div class="boxes-header hidden" id="boxesHeader">
    <h3>我的箱子</h3>
    <button class="btn-add-box" onclick="addBox()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新增箱子
    </button>
  </div>
  <div id="boxesGrid" class="boxes-grid hidden"></div>

  <!-- 箱子内物品视图 -->
  <div id="drawerItemsView" class="drawer-items-view hidden">
    <div class="drawer-items-header">
      <button class="btn-back" onclick="backToBoxes()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 id="drawerItemsTitle" class="drawer-items-title"></h2>
    </div>
    <div id="drawerItemsList" class="drawer-items-list"></div>
  </div>

  <!-- 统一日志区域（最近登记 + 查找日志 合并） -->
  <section id="logSection" class="log-section">
    <div class="section-header">
      <h2>日志<span id="logCount" class="log-count"></span></h2>
      <button class="btn-text" onclick="loadLogSection()">刷新</button>
    </div>
    <div id="logList" class="log-list">
      <div class="empty">加载中...</div>
    </div>
  </section>
</div>

<script src="/app.js"></script>
</body>
</html>
